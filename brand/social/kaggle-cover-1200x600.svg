<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Pentimento Core: a steganalysis corpus with its licences attached">
  <!--
    Kaggle dataset cover. Kaggle's minimum is 564x284; this is 1200x600, the
    same 2:1 the GitHub social card uses, so one ratio serves both and the
    thumbnail stays sharp where Kaggle scales it down.

    Figures are the corpus's own and are checked by tools/make_figures.py in
    its checking mode, label by label. The GitHub card in this folder carried a
    stale pairs count from 2026-09-22 to 2026-09-24, two days, which is the
    reason that check now reads this folder. "Weeks" appeared here first and
    was wrong; on a project arguing that every claim is traceable, an
    exaggerated one in a shipped artefact undercuts the argument.

    The offset squares bleeding off the right edge are the mark's own idea at
    poster scale: an earlier layer showing through a later one. They sit at 7%
    so they read as ground rather than as a second logo.
  -->
  <rect width="1200" height="600" fill="#F5F5F7"/>

  <g opacity="0.05">
    <rect x="880" y="-80" width="300" height="300" rx="34" fill="#0071E3"/>
    <rect x="960" y="-150" width="300" height="300" rx="34" fill="#1D1D1F"/>
    <rect x="1080" y="560" width="240" height="240" rx="27" fill="#0071E3"/>
  </g>

  <!-- The mark, at 112 units so it holds its own beside a 72px wordmark. -->
  <g transform="translate(88 188) scale(1.75)">
    <rect x="6" y="14" width="40" height="40" rx="7" fill="#0071E3"/>
    <rect x="18" y="6" width="40" height="40" rx="7" fill="#1D1D1F" opacity="0.92"/>
  </g>

  <text x="232" y="262" font-family="Fraunces, Georgia, serif" font-size="72"
        font-weight="600" letter-spacing="-1.1" fill="#1D1D1F">Pentimento</text>
  <text x="236" y="304" font-family="IBM Plex Mono, monospace" font-size="15"
        letter-spacing="3.4" fill="#0071E3">CORE TIER</text>

  <text x="88" y="392" font-family="Hanken Grotesk, system-ui, sans-serif"
        font-size="27" fill="#1D1D1F">A steganalysis corpus with its licences attached.</text>
  <text x="88" y="430" font-family="Hanken Grotesk, system-ui, sans-serif"
        font-size="19" fill="#6E6E73">The cover tier. The 35 stego arms are on the Internet Archive and HuggingFace.</text>

  <!-- A rule, not a box: the kit allows Line for rules and forbids shadows. -->
  <rect x="88" y="474" width="1024" height="1" fill="#D2D2D7"/>

  <!--
    THE FIGURES DESCRIBE THE KAGGLE COPY, WHICH IS COVERS ONLY.
    An earlier draft carried the pairs and arm counts of the whole corpus on
    the cover of a dataset containing neither, so a reader downloading 3.3 GB
    expecting 344,357 pairs found none. Those two numbers moved into the
    subtitle above as a pointer to where the arms actually are.
  -->
  <g font-family="IBM Plex Mono, monospace" fill="#1D1D1F">
    <text x="88" y="522" font-size="30">10,000</text>
    <text x="420" y="522" font-size="30">5,453</text>
    <text x="760" y="522" font-size="30">512</text>
  </g>
  <g font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" fill="#86868B">
    <text x="88" y="548">cover photographs</text>
    <text x="420" y="548">need a credit line</text>
    <text x="760" y="548">pixels square, PNG</text>
  </g>
</svg>
