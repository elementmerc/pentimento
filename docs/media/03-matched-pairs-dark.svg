<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324" role="img" aria-label="How a matched pair is made: both halves from one photograph through one encoder, differing only in the payload">
<rect x="0" y="0" width="1200" height="324" fill="#1D1D1F"/>
<text x="48" y="60" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">Pairs that differ only in the payload</text>
<text x="48" y="88" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">Both halves come off the same encoder, through the same code path, in the same number of writes.</text>
<rect x="48" y="130" width="250" height="76" fill="#262628" stroke="#3A3A3C" stroke-width="1" rx="4"/>
<text x="70" y="162" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">One photograph</text>
<text x="70" y="184" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">from Wikimedia Commons</text>
<line x1="298" y1="168" x2="350" y2="168" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="168" x2="350" y2="124" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="168" x2="350" y2="250" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="124" x2="396" y2="124" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="250" x2="396" y2="250" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<rect x="400" y="96" width="300" height="64" fill="#262628" stroke="#3A3A3C" stroke-width="1" rx="4"/>
<text x="422" y="122" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Nothing written</text>
<text x="422" y="144" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">the clean half</text>
<rect x="400" y="220" width="300" height="64" fill="#262628" stroke="#409CFF" stroke-width="1.6" rx="4"/>
<text x="422" y="246" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Payload written</text>
<text x="422" y="268" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">the only difference</text>
<line x1="700" y1="128" x2="752" y2="160" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="700" y1="252" x2="752" y2="220" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<rect x="756" y="152" width="396" height="76" fill="#16324D" rx="4"/>
<text x="780" y="180" fill="#409CFF" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="600">344,357 pairs</text>
<text x="780" y="204" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">containers verified byte-identical at pack time</text>
</svg>
