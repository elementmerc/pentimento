<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How a matched pair is made: both halves from one photograph through one encoder, differing only in the payload">
<rect x="0" y="0" width="1200" height="470" fill="#F5F5F7"/>
<text x="48" y="60" fill="#1D1D1F" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">Pairs that differ only in the payload</text>
<text x="48" y="88" fill="#6E6E73" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">Both halves come off the same encoder, through the same code path, in the same number of writes.</text>
<rect x="48" y="130" width="250" height="76" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" rx="4"/>
<text x="70" y="162" fill="#1D1D1F" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">One photograph</text>
<text x="70" y="184" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">from Wikimedia Commons</text>
<line x1="298" y1="168" x2="350" y2="168" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="168" x2="350" y2="124" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="168" x2="350" y2="250" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="124" x2="396" y2="124" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="250" x2="396" y2="250" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<rect x="400" y="96" width="300" height="64" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" rx="4"/>
<text x="422" y="122" fill="#1D1D1F" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Nothing written</text>
<text x="422" y="144" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">the clean half</text>
<rect x="400" y="220" width="300" height="64" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.6" rx="4"/>
<text x="422" y="246" fill="#0071E3" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Payload written</text>
<text x="422" y="268" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">the only difference</text>
<line x1="700" y1="128" x2="752" y2="160" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<line x1="700" y1="252" x2="752" y2="220" stroke="#86868B" stroke-width="1" stroke-linecap="round"/>
<rect x="756" y="152" width="396" height="76" fill="#D6E9FC" rx="4"/>
<text x="780" y="180" fill="#0071E3" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="600">341,997 pairs</text>
<text x="780" y="204" fill="#6E6E73" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">containers verified byte-identical at pack time</text>
<line x1="48" y1="290" x2="1152" y2="290" stroke="#D2D2D7" stroke-width="1" stroke-linecap="round"/>
<text x="48" y="312" fill="#A8341F" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Three measurements were lost before the rule was enforced structurally rather than restated</text>
<text x="48" y="340" fill="#A8341F" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600">1</text>
<text x="74" y="340" fill="#1D1D1F" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">outguess re-encoded at quality 75 whatever it was given</text>
<text x="74" y="357" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">the halves came from different quality settings</text>
<text x="48" y="380" fill="#A8341F" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600">2</text>
<text x="74" y="380" fill="#1D1D1F" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">two different encoders wrote the two halves</text>
<text x="74" y="397" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">the detector could read the encoder, not the payload</text>
<text x="48" y="420" fill="#A8341F" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="600">3</text>
<text x="74" y="420" fill="#1D1D1F" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">same encoder, different number of writes</text>
<text x="74" y="437" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">jpeglib prepends a JFIF APP0 every time, so one half carried two and the other three</text>
</svg>
