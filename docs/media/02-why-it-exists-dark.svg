<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Licence comparison: BOSSbase and ALASKA2 may be used but not republished; Pentimento may be both">
<rect x="0" y="0" width="1200" height="650" fill="#1D1D1F"/>
<text x="48" y="60" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">Why it exists</text>
<text x="48" y="88" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">The standard corpora in this field can be used and cannot be republished. A stego image is a</text>
<text x="48" y="109" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">derivative work, so the arms built from them cannot be shared either.</text>
<rect x="48" y="140" width="1104" height="94" fill="#262628" stroke="#3A3A3C" stroke-width="1" rx="4"/>
<text x="72" y="174" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">BOSSbase</text>
<text x="72" y="198" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">10,000 covers</text>
<text x="240" y="172" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">No licence survives. The organisers claimed rights and the</text>
<text x="240" y="192" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">terms died with their host</text>
<rect x="860" y="160" width="132" height="48" fill="#16324D" rx="4"/>
<text x="926" y="182" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="926" y="200" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">use it</text>
<rect x="1010" y="160" width="132" height="48" fill="#3A211B" rx="4"/>
<text x="1076" y="182" fill="#E0705A" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">no</text>
<text x="1076" y="200" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">republish it</text>
<rect x="48" y="252" width="1104" height="94" fill="#262628" stroke="#3A3A3C" stroke-width="1" rx="4"/>
<text x="72" y="286" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">ALASKA2</text>
<text x="72" y="310" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">80,000 covers</text>
<text x="240" y="284" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">CC BY-NC-ND. The no-derivatives term forbids publishing a</text>
<text x="240" y="304" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">stego image made from a cover</text>
<rect x="860" y="272" width="132" height="48" fill="#16324D" rx="4"/>
<text x="926" y="294" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="926" y="312" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">use it</text>
<rect x="1010" y="272" width="132" height="48" fill="#3A211B" rx="4"/>
<text x="1076" y="294" fill="#E0705A" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">no</text>
<text x="1076" y="312" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">republish it</text>
<rect x="48" y="364" width="1104" height="94" fill="#262628" stroke="#409CFF" stroke-width="1.6" rx="4"/>
<text x="72" y="398" fill="#409CFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">Pentimento</text>
<text x="72" y="422" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">10,000 covers</text>
<text x="240" y="396" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">CC0, public domain and CC BY only. Every file carries its</text>
<text x="240" y="416" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">own terms and its own credit line</text>
<rect x="860" y="384" width="132" height="48" fill="#16324D" rx="4"/>
<text x="926" y="406" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="926" y="424" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">use it</text>
<rect x="1010" y="384" width="132" height="48" fill="#16324D" rx="4"/>
<text x="1076" y="406" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="1076" y="424" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">republish it</text>
<text x="48" y="500" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Every Pentimento cover, by licence</text>
<rect x="48" y="516" width="287.8" height="36" fill="#409CFF" rx="2" opacity="0.9"/>
<text x="60" y="533" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CC0</text>
<text x="60" y="549" fill="#FFFFFF" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" opacity="0.85">2,625</text>
<rect x="337.8" y="516" width="287.6896" height="36" fill="#409CFF" rx="2" opacity="0.79"/>
<text x="349.8" y="533" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CC BY 2.0</text>
<text x="349.8" y="549" fill="#FFFFFF" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" opacity="0.85">2,624</text>
<rect x="627.4896" y="516" width="210.1888" height="36" fill="#409CFF" rx="2" opacity="0.68"/>
<text x="639.4896" y="533" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Public domain</text>
<text x="639.4896" y="549" fill="#FFFFFF" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" opacity="0.85">1,922</text>
<rect x="839.6784" y="516" width="196.0576" height="36" fill="#409CFF" rx="2" opacity="0.57"/>
<text x="851.6784" y="533" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CC BY 4.0</text>
<text x="851.6784" y="549" fill="#FFFFFF" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" opacity="0.85">1,794</text>
<rect x="1037.7359999999999" y="516" width="91.84" height="36" fill="#409CFF" rx="2" opacity="0.46"/>
<rect x="1131.576" y="516" width="18.2032" height="36" fill="#409CFF" rx="2" opacity="0.35"/>
<rect x="1151.7792" y="516" width="2" height="36" fill="#409CFF" rx="2" opacity="0.24"/>
<text x="48" y="574" fill="#86868B" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">and CC BY 3.0 850, CC BY 2.5 183, CC BY 1.0 2</text>
<text x="48" y="604" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">5,453 of 10,000 covers require a credit line, and every stego image made from one inherits it.</text>
<text x="48" y="624" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">The line is already written into each record.</text>
</svg>
