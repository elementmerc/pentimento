<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Licence comparison: BOSSbase and ALASKA2 may be used but not republished; Pentimento may be both">
<rect x="0" y="0" width="1200" height="560" fill="#1D1D1F"/>
<text x="48" y="60" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">Why it exists</text>
<text x="48" y="88" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">The standard corpora in this field can be used and cannot be republished. A stego image is a derivative work, so the arms built from them cannot be shared either.</text>
<rect x="48" y="130" width="1104" height="94" fill="#262628" stroke="#3A3A3C" stroke-width="1" rx="4"/>
<text x="72" y="164" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">BOSSbase</text>
<text x="72" y="188" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">10,000 covers</text>
<text x="230" y="164" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">No licence survives. The organisers claimed rights and the terms</text>
<text x="230" y="184" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13"> died with their host</text>
<rect x="870" y="152" width="132" height="44" fill="#3A211B" rx="4"/>
<text x="936" y="172" fill="#E0705A" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">no</text>
<text x="936" y="188" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">use it</text>
<rect x="1020" y="152" width="132" height="44" fill="#3A211B" rx="4"/>
<text x="1086" y="172" fill="#E0705A" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">no</text>
<text x="1086" y="188" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">republish it</text>
<rect x="48" y="238" width="1104" height="94" fill="#262628" stroke="#3A3A3C" stroke-width="1" rx="4"/>
<text x="72" y="272" fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">ALASKA2</text>
<text x="72" y="296" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">80,000 covers</text>
<text x="230" y="272" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">CC BY-NC-ND. The no-derivatives term forbids publishing a stego </text>
<text x="230" y="292" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">image made from a cover</text>
<rect x="870" y="260" width="132" height="44" fill="#16324D" rx="4"/>
<text x="936" y="280" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="936" y="296" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">use it</text>
<rect x="1020" y="260" width="132" height="44" fill="#3A211B" rx="4"/>
<text x="1086" y="280" fill="#E0705A" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">no</text>
<text x="1086" y="296" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">republish it</text>
<rect x="48" y="346" width="1104" height="94" fill="#262628" stroke="#409CFF" stroke-width="1.6" rx="4"/>
<text x="72" y="380" fill="#409CFF" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="20" font-weight="600">Pentimento</text>
<text x="72" y="404" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12">10,000 covers</text>
<text x="230" y="380" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">CC0, public domain and CC BY only. Every file carries its own te</text>
<text x="230" y="400" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">rms and its own credit line</text>
<rect x="870" y="368" width="132" height="44" fill="#16324D" rx="4"/>
<text x="936" y="388" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="936" y="404" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">use it</text>
<rect x="1020" y="368" width="132" height="44" fill="#16324D" rx="4"/>
<text x="1086" y="388" fill="#409CFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">yes</text>
<text x="1086" y="404" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">republish it</text>
<text x="48" y="470" fill="#FFFFFF" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Every Pentimento cover, by licence</text>
<rect x="48" y="486" width="287.8" height="34" fill="#409CFF" rx="2" opacity="0.85"/>
<text x="58" y="508" fill="#262628" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CC0</text>
<text x="58" y="538" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">2,625</text>
<rect x="337.8" y="486" width="287.6896" height="34" fill="#409CFF" rx="2" opacity="0.75"/>
<text x="347.8" y="508" fill="#262628" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CC BY 2.0</text>
<text x="347.8" y="538" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">2,624</text>
<rect x="627.4896" y="486" width="210.1888" height="34" fill="#409CFF" rx="2" opacity="0.65"/>
<text x="637.4896" y="508" fill="#262628" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Public domain</text>
<text x="637.4896" y="538" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">1,922</text>
<rect x="839.6784" y="486" width="196.0576" height="34" fill="#409CFF" rx="2" opacity="0.55"/>
<text x="849.6784" y="508" fill="#262628" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CC BY 4.0</text>
<text x="849.6784" y="538" fill="#86868B" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">1,794</text>
<rect x="1037.7359999999999" y="486" width="91.84" height="34" fill="#409CFF" rx="2" opacity="0.45"/>
<rect x="1131.576" y="486" width="18.2032" height="34" fill="#409CFF" rx="2" opacity="0.35"/>
<rect x="1151.7792" y="486" width="0" height="34" fill="#409CFF" rx="2" opacity="0.25"/>
<text x="48" y="560" fill="#A1A1A6" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">5,453 of 10,000 covers require a credit line, and every stego image made from one inherits it. The line is already written into each record.</text>
</svg>
