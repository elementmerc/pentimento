# Publish the documentation site to GitHub Pages.
#
# WHY THIS EXISTS
#
# It did not, and nothing else did either: this repository had no workflows at all. The site was
# built by hand, into `docs/.vitepress/dist/`, which is gitignored, so a documentation correction
# reached a reader only if somebody remembered to rebuild and copy it somewhere. On 2026-09-23 a
# review found the built copy still rendering a Kaggle row that had been corrected in the source,
# which means the fix had shipped nothing. A build whose output reaches no consequence is the
# same failure shape as prose that is right in the generator and wrong in public.
#
# WHY IT DEPLOYS `main` AND NOT `dev`
#
# Pages serves one site per repository, so the two branches cannot both own the root. This
# publishes `main`, because the site documents a corpus somebody can actually download, and
# pages describing unreleased work at a public URL is what baseline section 16 exists to
# prevent.
#
# THE DEPLOY IS GATED ON THE REF, NOT ON A BELIEF ABOUT GITHUB'S UI. An earlier draft of this
# header said "GitHub only runs manual workflows from the default branch, so it publishes
# whatever `main` holds". Both halves were wrong, and the mistake was load-bearing: GitHub
# lists a `workflow_dispatch` workflow from the default branch but then offers a BRANCH
# SELECTOR, and this repository's default branch is `dev`. So the one reachable path published
# unreleased documentation to the public URL, and the comment would have talked a reader out of
# checking. `if: github.ref == 'refs/heads/main'` on the deploy job is the guard; a sentence is
# not.
#
# `dev` is built on every push so a dead internal link fails on the branch where documentation
# work actually lands. It is built and never deployed.
#
# `workflow_dispatch` is here so a correction can be published without waiting for a release.
# Choose `main` in the branch selector; anything else builds and stops at the guard.
name: Documentation site

# The path lists include `brand/**` and `tools/make_figures.py` because the figures check below
# reads BOTH the generated figures and the hand-drawn identity cards. With `docs/**` alone, the
# commit that corrected "341,997 pairs" on three cards and added that very check would have
# triggered no run at all: it touched only those two trees.
on:
  push:
    branches: [main, dev]
    paths: &watched
      - 'docs/**'
      - 'brand/**'
      - 'tools/make_figures.py'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *watched
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `lastUpdated` is on in the VitePress config and reads each page's git history. A
          # shallow clone gives every file the tip commit's date, so the whole site would claim
          # to have been updated on the day it was built.
          fetch-depth: 0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `actions/configure-pages` used to run here and is deliberately gone. It calls the Pages
      # REST API, the build job holds `contents: read` and nothing else, and the standard result
      # is "Resource not accessible by integration" on the first run: red on the release, and red
      # on every fork pull request, where the token is read-only whatever we grant. Its outputs
      # bought nothing either, because the site's base path is set in `config.mjs`.
      - name: Install, from the lockfile only
        working-directory: docs
        # `--ignore-scripts`: once this repository is public, a fork's pull request supplies its
        # own package.json and lockfile, and install lifecycle scripts would run here. VitePress
        # builds without them.
        run: npm ci --ignore-scripts

      - name: Build, which fails on a dead link
        # `ignoreDeadLinks` is deliberately unset in the config, so a link from one page of the
        # site to another cannot break without failing here.
        working-directory: docs
        run: npm run build

      - name: The generated figures and the identity cards match the data file
        # NAMED FOR WHAT IT READS. It was called "the figures in the docs still match the
        # corpus", which claimed more than it does: it reads `docs/media/*.svg` and every SVG
        # under `brand/`, and opens no Markdown at all. The site's prose figures are
        # hand-typed, and one of them ("344,348 pairs" in config.mjs) was found by a person
        # reading it two commits before this check existed. A step whose name overstates its
        # reach is worse than no step, because a release reviewer trusts the name.
        run: python3 tools/make_figures.py --check

      - name: The brand assets and fonts the site references are actually there
        # The nav logo and the hero point into `docs/public/`, and a missing one renders as a
        # broken image on the front page without failing the build. The fonts are here for a
        # second reason: they are redistributed under OFL 1.1, which requires the licence to
        # travel with them, so shipping the faces without OFL.txt would be a licence breach
        # rather than a cosmetic fault.
        run: |
          set -eu
          for f in mark.svg mark-reversed.svg favicon.svg fonts/fonts.css fonts/OFL.txt; do
            if [ ! -f "docs/public/$f" ]; then
              echo "::error::docs/public/$f is referenced by the site and does not exist"
              exit 1
            fi
          done
          if ! ls docs/public/fonts/*.woff2 >/dev/null 2>&1; then
            echo "::error::no woff2 files in docs/public/fonts, so the site would fall back"
            exit 1
          fi
          echo "  all referenced brand assets, fonts and the OFL notice are present"

      - name: The pages the deploy will smoke-test exist in the build output
        # THIS is the gate. The identically-named step in the deploy job runs after the live
        # site has already been swapped, so it can only report a broken publish, never prevent
        # one. Checking the same paths here, against `dist`, is what actually stops one.
        run: |
          set -eu
          rc=0
          for path in index.html guide/get-it.html guide/using-it.html \
                      guide/licence.html mark.svg; do
            if [ ! -f "docs/.vitepress/dist/$path" ]; then
              echo "::error::$path is missing from the build, so the deploy check would 404"
              rc=1
            fi
          done
          exit "$rc"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to Pages
    needs: build
    # `main` ONLY. `event_name != 'pull_request'` was not enough: a push to `dev` and a manual
    # dispatch against `dev` both satisfy it, and both would have published unreleased pages.
    #
    # A GitHub Pages site is served publicly whatever the repository's visibility, so this guard
    # is the whole of what stands between `dev` and a public URL.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deployment at a time, and never cancel one in flight: a cancelled deploy can leave the
    # published site mid-swap, and the queued run behind it would publish the same content anyway.
    #
    # ON THE JOB, NOT THE WORKFLOW. At workflow level this group also held every pull request and
    # every `dev` build, none of which can deploy, so a queue of branch builds sat in front of the
    # one run that mattered with cancellation turned off.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Scoped to this job alone. `pages: write` and `id-token: write` are what the deployment
    # needs; the build job that runs `npm ci` over the dependency tree gets neither.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # A check that cannot see the thing it is about is the defect this whole file exists to
      # correct, so the last step fetches the pages a reader would actually open, from the site
      # that was just published, rather than from a directory on the runner.
      #
      # IT IS A DETECTOR, NOT A GATE. It runs after the deploy has already swapped the live
      # site, so a failure here means the site is broken AND red, with no rollback. The build
      # job checks the same paths against `dist` beforehand, which is the part that can
      # actually prevent a bad publish.
      - name: The pages a reader lands on resolve on the published site
        run: |
          set -uo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          rc=0
          for path in "" "/guide/get-it" "/guide/using-it" "/guide/licence" "/mark.svg"; do
            url="$base$path"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok   $code  $url"
            else
              echo "::error::$url returned $code, so a reader following it gets nothing"
              rc=1
            fi
          done
          exit "$rc"
