# Publish the documentation site to GitHub Pages.
#
# WHY THIS EXISTS
#
# It did not, and nothing else did either: this repository had no workflows at all. The site was
# built by hand, into `docs/.vitepress/dist/`, which is gitignored, so a documentation correction
# reached a reader only if somebody remembered to rebuild and copy it somewhere. On 2026-09-23 a
# review found the built copy still rendering a Kaggle row that had been corrected in the source,
# which means the fix had shipped nothing. A build whose output reaches no consequence is the
# same failure shape as prose that is right in the generator and wrong in public.
#
# WHY IT DEPLOYS `main` AND NOT `dev`
#
# Pages serves one site per repository, so the two branches cannot both own the root. This
# publishes `main`, because the site documents a corpus somebody can actually download, and
# pages describing unreleased work at a public URL is what baseline section 16 exists to
# prevent. Documentation on `dev` is still built by the `build` job on every push, so a dead
# internal link fails there; it just is not published until it is released.
#
# `workflow_dispatch` is here so a documentation correction can be published without waiting for
# a release, which is exactly the case that went unserved above. GitHub only runs manual
# workflows from the default branch, so it publishes whatever `main` holds.
name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a cancelled deploy can leave the
# published site mid-swap, and the queued run that follows would publish the same content anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `lastUpdated` is on in the VitePress config and reads each page's git history. A
          # shallow clone gives every file the tip commit's date, so the whole site would claim
          # to have been updated on the day it was built.
          fetch-depth: 0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Install, from the lockfile only
        working-directory: docs
        run: npm ci

      - name: Build, which fails on a dead link
        # `ignoreDeadLinks` is deliberately unset in the config, so a link from one page of the
        # site to another cannot break without failing here.
        working-directory: docs
        run: npm run build

      - name: The figures in the docs still match the corpus they describe
        # This repository's PART C rule: numbers in published prose are DERIVED and verified,
        # never hand-edited, because a README once shipped a cover count the corpus did not
        # have and nothing could catch it. The site is published prose.
        run: python3 tools/make_figures.py --check

      - name: The brand assets the site references are actually there
        # The nav logo and the hero both point into `docs/public/`. A missing file renders as a
        # broken image on the front page, which the build does not fail on.
        run: |
          set -eu
          for f in mark.svg mark-reversed.svg favicon.svg; do
            if [ ! -f "docs/public/$f" ]; then
              echo "::error::docs/public/$f is referenced by the site and does not exist"
              exit 1
            fi
          done
          echo "  all referenced brand assets present"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Scoped to this job alone. `pages: write` and `id-token: write` are what the deployment
    # needs; the build job that runs `npm ci` over the dependency tree gets neither.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # A check that cannot see the thing it is about is the defect this whole file exists to
      # correct, so the last step fetches the pages a reader would actually open, from the site
      # that was just published, rather than from a directory on the runner.
      - name: The pages a reader lands on resolve on the published site
        run: |
          set -uo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          rc=0
          for path in "" "/guide/get-it" "/guide/using-it" "/guide/licence" "/mark.svg"; do
            url="$base$path"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok   $code  $url"
            else
              echo "::error::$url returned $code, so a reader following it gets nothing"
              rc=1
            fi
          done
          exit "$rc"
